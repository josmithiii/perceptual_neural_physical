[project]
name = "pnp_synth"
version = "0.1.0.dev0"
description = "Perceptual-Neural-Physical (PNP) modeling of musical timbre"

dependencies = [
    "torch>=2.0",
    "torchvision",
    "torchaudio",
    "kymatio",
    "librosa",
    "pandas",
    "scikit-learn",
    "soundfile",
    "auraloss",
    "pytorch-lightning",
    "nnAudio",
    "h5py",
    "joblib"
]

[project.optional-dependencies]
full = [
    "muda",
    "jams",
    "black",
    "flake8",
    "jupyter",
    "jupyterlab"
]

[project.urls]
"Homepage" = "https://github.com/lylyhan/perceptual_neural_physical"
"Bug Tracker" = "https://github.com/lylyhan/perceptual_neural_physical"


[build-system]
requires = [
    "setuptools >= 61.0",
    "wheel",
]
